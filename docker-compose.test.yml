services:
  postgres-test:
    image: postgres:16-alpine
    container_name: rpg-campaign-studio-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rpg_campaign_studio_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rpg_campaign_studio_test"]
      interval: 2s
      timeout: 3s
      retries: 15
